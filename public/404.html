<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UPlate</title>
    <script type="text/javascript">
      // GitHub Pages SPA shim: any deep path hits this 404, we re-write it to
      // /?/<original-path> so the root index.html can restore the URL and let
      // React Router handle it. pathSegmentsToKeep = 0 for a custom domain
      // served at the root.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
